name: Build LuckySpeeder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        target: [arm64-apple-ios, arm64-apple-ios-macabi, arm64-apple-xros, arm64-apple-tvos]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash build.sh ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuckySpeeder-${{ matrix.target }}
          path: out/${{ matrix.target }}/LuckySpeeder.dylib
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          cd dist
          for d in */; do
            target="${d%/}"
            cp "$d/LuckySpeeder.dylib" "LuckySpeeder-$target.dylib"
          done
          ls -l

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LuckySpeeder-*.dylib
